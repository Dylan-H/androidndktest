name: Build Android APK with NDK/CMake

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:                     # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lanshare-kmp

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Java 17 (Android Gradle Plugin 8.0+ 需要)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. 设置 Android SDK 环境变量 (runner 已预装)
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      # 4. 列出可用的 NDK 和 CMake 版本 (可选，用于调试)
      - name: List available NDK and CMake
        run: |
          echo "Available NDK versions:"
          ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "No NDK found"
          echo "Available CMake versions:"
          ls $ANDROID_HOME/cmake/ 2>/dev/null || echo "No CMake found"

      # 5. 确保 NDK 和 CMake 已安装 (通过 sdkmanager)
      - name: Install required NDK and CMake
        run: |
          # 安装 NDK (修改版本号为你需要的)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529"
          # 安装 CMake (修改版本号为你需要的)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

      # 6. 赋予 Gradle 执行权限并开始构建
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # 7. 上传 APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanshare-kmp-release
          path: lanshare-kmp/app/build/outputs/apk/release/*.apk
