name: Build Android APK with NDK/CMake

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'lanshare-kmp/**'           # 只有修改 lanshare-kmp 目录时才触发
  workflow_dispatch:                # 手动触发不受限制

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lanshare-kmp   # 关键：所有 run 步骤默认在此目录下执行

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
        # cache 的路径默认是 ~/.gradle/caches/，不受 working-directory 影响，正常工作

      # 3. 设置 Android SDK, NDK 和 CMake
      - name: Set up Android SDK/NDK/CMake
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '21.4.7075529'      # 改成你项目用的 NDK 版本
          cmake-version: '3.22.1'           # 改成你项目用的 CMake 版本
          build-tools-version: '34.0.0'

      # 4. 赋予 Gradle 执行权限并开始构建
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # 5. 上传 APK 作为构建产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanshare-kmp-release
          path: lanshare-kmp/app/build/outputs/apk/release/*.apk
        # 注意：path 是相对于仓库根目录的，不受 working-directory 影响，所以要写完整路径
