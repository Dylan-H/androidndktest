name: Build Android APK with NDK/CMake

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:                     # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest               # 使用 Ubuntu 环境，工具链更全 [citation:2]

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. 设置 Android SDK, NDK 和 CMake
      - name: Set up Android SDK/NDK/CMake
        uses: android-actions/setup-android@v3   # 社区维护的 Action [citation:3]
        # 或者也可以使用官方维护的 amyu/setup-android@v5 [citation:4]
        with:
          # 指定 NDK 版本 (推荐使用 LTS 版本)
          ndk-version: '26.1.10909125'           # 根据项目需求填写 [citation:1]
          # 指定 CMake 版本
          cmake-version: '3.22.1'                # 根据项目需求填写 [citation:4]
          # 指定 Build Tools 版本
          build-tools-version: '34.0.0'

      # 4. 赋予 Gradle 执行权限并开始构建
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # 5. 上传 APK 作为构建产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
